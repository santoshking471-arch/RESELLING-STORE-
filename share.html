<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Share Product</title>

<style>
body{
  font-family:sans-serif;
  background:#f5f5f5;
  text-align:center;
  padding:20px;
}

.box{
  background:#fff;
  padding:15px;
  border-radius:10px;
  margin:20px auto;
  width:90%;
  max-width:400px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.linkBox{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#eee;
  padding:10px;
  border-radius:8px;
  font-weight:bold;
}

.copyBtn{
  background:#000;
  color:#fff;
  border:none;
  padding:6px 10px;
  border-radius:6px;
}

.icons{
  display:flex;
  justify-content:space-around;
  margin-top:15px;
}

.icons a{
  text-decoration:none;
  font-size:30px;
}

.moreBtn{
  margin-top:10px;
  padding:8px;
  background:#ddd;
  border-radius:8px;
  border:none;
}
</style>
</head>

<body>

<!-- 🔗 Link Box -->
<div class="box">
  <div class="linkBox">
    <span id="productLink"></span>
    <button class="copyBtn" onclick="copyLink()">Copy</button>
  </div>
</div>

<!-- 📤 Share Options -->
<div class="box">
  <h3>Share On ↓</h3>

  <div class="icons">
    <a id="wa">🟢</a>
    <a id="fb">🔵</a>
    <a id="insta">📸</a>
  </div>

  <button class="moreBtn" onclick="moreShare()">More</button>
</div>

<script>

// 🔥 URL se product ID lo
let params = new URLSearchParams(window.location.search);
let id = params.get("id");

// 🔗 Product link banao
let productURL = window.location.origin + "/product.html?id=" + id;

// show link
document.getElementById("productLink").innerText = productURL;

// ✅ WhatsApp
document.getElementById("wa").href =
  "https://wa.me/?text=" + encodeURIComponent(productURL);

// ✅ Facebook
document.getElementById("fb").href =
  "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(productURL);

// ❌ Instagram (direct share nahi hota)
document.getElementById("insta").href = "https://www.instagram.com/";

// 📋 Copy
function copyLink(){
  navigator.clipboard.writeText(productURL);
  alert("Copied 😎");
}

// 🔥 More (mobile share popup)
function moreShare(){
  if(navigator.share){
    navigator.share({
      title:"Product",
      url:productURL
    });
  }else{
    alert("Not supported");
  }
}

</script>

</body>
</html>
