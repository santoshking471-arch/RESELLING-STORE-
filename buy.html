<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f1f3f6;
}

/* container */
.container {
  max-width: 500px;
  margin: auto;
  background: white;
}

/* image */
.product-img {
  width: 100%;
  height: 300px;
  object-fit: cover;
}

/* details */
.details {
  padding: 15px;
}

.title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 5px;
}

.price {
  color: green;
  font-size: 20px;
  margin-bottom: 10px;
}

.desc {
  font-size: 14px;
  color: #555;
  margin-bottom: 20px;
}

/* button */
.buy-btn {
  width: 100%;
  padding: 12px;
  background: #ff3f6c;
  color: white;
  border: none;
  font-size: 16px;
  border-radius: 6px;
  cursor: pointer;
}

.buy-btn:hover {
  background: #e7335e;
}
</style>
</head>

<body>
<div class="container">

  <!-- IMAGE -->
  <img id="bimg" class="product-img">

  <!-- DETAILS -->
  <div class="details">

    <div class="title" id="bname"></div>
    <div class="price" id="bprice"></div>

    <div class="desc">
      High quality product 😎  
      Best for daily use.  
      Limited stock available!
    </div>

    <!-- BUY BUTTON -->
    <button class="buy-btn" onclick="orderNow()">Buy Now</button>

  </div>

</div>
<script>
window.onload = function(){
  let name = localStorage.getItem("pname");
  let price = localStorage.getItem("pprice");
  let image = localStorage.getItem("pimage");

  document.getElementById("bname").innerText = name;
  document.getElementById("bprice").innerText = "₹" + price;
  document.getElementById("bimg").src = image;
}

function orderNow(){
  window.open("https://wa.me/918817409243?text=I want to buy this product");
}
</script>

</body>
</html>
