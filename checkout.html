<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>

<style>
body{
  font-family: Arial;
  background:#f1f3f6;
  margin:0;
}

.container{
  max-width:500px;
  margin:auto;
  background:#fff;
  padding:15px;
}

input, textarea{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border:1px solid #ccc;
  border-radius:5px;
  font-size:15px;
}

button{
  width:100%;
  padding:12px;
  background:#ff3f6c;
  color:#fff;
  border:none;
  border-radius:6px;
  font-size:16px;
}
</style>

<!-- 🔥 FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

</head>

<body>

<div class="container">

  <h2>Checkout</h2>

  <input type="text" id="name" placeholder="Full Name">
  <input type="number" id="mobile" placeholder="Mobile Number">
  <input type="number" id="altmobile" placeholder="Alternative Mobile (Optional)">
  <textarea id="address" placeholder="Address"></textarea>
  <input type="number" id="pincode" placeholder="Pincode">

  <button onclick="placeOrder()">Place Order</button>

</div>

<script>

/// 🔥 FIREBASE CONFIG (👉 अपना डालना)
var firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();


/// 🔥 PRODUCT DATA
let pname = localStorage.getItem("pname");
let pprice = localStorage.getItem("pprice");
let pimage = localStorage.getItem("pimage");


/// 🔥 PLACE ORDER FUNCTION
function placeOrder(){

  alert("Clicked 😎"); // debug

  let name = document.getElementById("name").value;
  let mobile = document.getElementById("mobile").value;
  let altmobile = document.getElementById("altmobile").value;
  let address = document.getElementById("address").value;
  let pincode = document.getElementById("pincode").value;

  if(!name || !mobile || !address || !pincode){
    alert("Please fill all required fields 😒");
    return;
  }

  db.collection("orders").add({
    name: name,
    mobile: mobile,
    altmobile: altmobile,
    address: address,
    pincode: pincode,

    productName: pname,
    productPrice: pprice,
    productImage: pimage,

    createdAt: new Date()
  })
  .then(()=>{
    alert("Order Placed Successfully 🎉");

    // clear form
    document.getElementById("name").value = "";
    document.getElementById("mobile").value = "";
    document.getElementById("altmobile").value = "";
    document.getElementById("address").value = "";
    document.getElementById("pincode").value = "";

    // optional redirect
    window.location.href = "index.html";
  })
  .catch((err)=>{
    console.error(err);
    alert("Error aa gaya 😢");
  });

}

</script>

</body>
</html>
