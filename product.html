<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f1f3f6;
}

header {
  background: linear-gradient(45deg,#2874f0,#1c5ed6);
  color: white;
  padding: 12px;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
}

.container {
  max-width: 500px;
  margin: auto;
  background: white;
}

.product-img {
  width: 100%;
  height: 300px;
  object-fit: contain;
  background: #fff;
}

.details {
  padding: 15px;
}

.title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 5px;
}

.price {
  color: green;
  font-size: 22px;
  margin-bottom: 10px;
}

.desc {
  font-size: 14px;
  color: #555;
  margin-bottom: 20px;
}

.features {
  font-size: 14px;
  margin-bottom: 20px;
}

.features li {
  margin-bottom: 5px;
}

.btns {
  display: flex;
  gap: 10px;
}

.cart-btn {
  flex: 1;
  padding: 12px;
  background: orange;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 16px;
}

.buy-btn {
  flex: 1;
  padding: 12px;
  background: #ff3f6c;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 16px;
}

.back {
  padding: 10px;
  cursor: pointer;
  color: #2874f0;
}
  .imgBox{
  position: relative;
}

.shareIcon{
  position: absolute;
  right: 15px;
  bottom: 20px;

  width: 55px;
  height: 55px;

  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<header>TyFenix Product</header>

<div class="container">

  <div class="back" onclick="goBack()">← Back</div>

  <!-- IMAGE -->
  <img id="pimg" class="product-img">

   <!-- 🔗 Share Button (YAHI ADD KIYA 😏) -->
  <img src="https://i.imgur.com/gSSvAwW.png" 
     class="shareIcon" 
     onclick="openShare('${doc.id}')" />

  <!-- DETAILS -->
  <div class="details">
    <div class="title" id="pname"></div>
    <div class="price" id="pprice"></div>

    <div class="desc">
      Premium quality product 😎 <br>
      Best for daily use. <br>
      Limited stock available!
    </div>

    <ul class="features">
      <li>✔ High Quality</li>
      <li>✔ Fast Delivery</li>
      <li>✔ Cash on Delivery Available</li>
    </ul>

    <div class="btns">
      <button class="cart-btn" onclick="addCart()">Add to Cart</button>
      <button class="buy-btn" onclick="orderNow()">Buy Now</button>
    </div>
  </div>

</div>

<script>

// ✅ DATA LOAD (FIXED)
let name = localStorage.getItem("pname");
let price = localStorage.getItem("pprice");
let image = localStorage.getItem("pimage");

// ✅ SHOW DATA
document.getElementById("pname").innerText = name || "No Name";
document.getElementById("pprice").innerText = "₹" + (price || "0");
document.getElementById("pimg").src = image || "https://i.imgur.com/N8BVXRG.jpeg";

// BACK
function goBack(){
  window.history.back();
}

// ADD CART
function addCart(){
  alert("Added to Cart 🛒");
}

// BUY
function orderNow(){
  window.location.href = "checkout.html";
}
function openShare(id){
  window.location.href = "share.html?id=" + id;
}
</script>

</body>
</html>
