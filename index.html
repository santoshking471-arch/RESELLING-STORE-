  db.collection("products").onSnapshot(data=>{

    data.forEach(doc=>{
      let p=doc.data();

      console.log(p);

      html+=`
      <div class="card">
        <img src="${p.image}" onclick="checkLoginAndBuy('${p.name}', '${p.price}', '${p.image}')">
        <h4>${p.name}</h4>

        <div class="priceRow">
          <span class="price">₹${p.price}
          <button class="buy" onclick="checkLoginAndBuy('${p.name}', '${p.price}', '${p.image}')">Buy</button>
        </div>
      </div>`;
    });

    products.innerHTML=html;
  });
}

  window.location.href = "product.html";
}
// ADMIN IMAGE UPLOAD


// SEARCH
search.oninput=function(){
  let val=this.value.toLowerCase();

  db.collection("products").get().then(data=>{
    let html="";
    data.forEach(doc=>{
      let p=doc.data();

      if(p.name.toLowerCase().includes(val)){
        html+=`
        <div class="card">
          <img src="${p.image}">
          <h4>${p.name}</h4>
          <div class="priceRow">
            <span class="price">₹${p.price}</span>
            <button class="buy" onclick="buy('${doc.id}','${p.name}','${p.price}')">Buy</button>
          </div>
        </div>`;
      }
    });

    products.innerHTML=html;
  });
};

// START
loadProducts();
function openUpload(){
  document.getElementById("uploadBox").style.display = "block";
}

function uploadNow(){
  let name = document.getElementById("pname").value;
  let price = document.getElementById("pprice").value;
  let file = document.getElementById("pimage").files[0];

  let ref = storage.ref("products/" + file.name);

  ref.put(file).then(()=>{
    ref.getDownloadURL().then(url=>{

      db.collection("products").add({
        name:name,
        price:price,
        image:url
      });

      alert("Uploaded ✅");
    });
  });
}
function checkLoginAndBuy(name, price, image){

  let user = firebase.auth().currentUser;

  if(!user){

    return;
  }

  localStorage.setItem("pname", name);
  localStorage.setItem("pprice", price);
  localStorage.setItem("pimage", image);

  window.location.href = "product.html";
}
