<!DOCTYPE html>
<html>
<head>
<title>Online Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

<style>
body {margin:0;font-family:Arial;background:#f1f5f9;}
header {background:#0f172a;color:white;padding:5px;text-align:center;}
#topBar {display:flex;justify-content:space-between;padding:6px;}

button {padding:5px 8px;border:none;border-radius:5px;font-size:12px;}
#ordersBtn {display:none;background:green;color:white;}
#adminBtn {display:none;background:red;color:white;}

#search {width:95%;margin:8px;padding:6px;}

#products {
display:grid;
grid-template-columns:repeat(2,1fr);
gap:6px;
padding:6px;
}

.card {
background:#fff;
padding:6px;
border-radius:8px;
text-align:center;
}

.card img {
width:100%;
height:100px;
object-fit:contain;
border-radius:6px;
}

.priceRow {
display:flex;
justify-content:space-between;
align-items:center;
}

.price {color:green;font-weight:bold;}
.buy {background:#22c55e;color:white;}
</style>
</head>

<body>

<header style="background: linear-gradient(45deg,#2874f0,#1c5ed6); padding:5px; display:flex; align-items:center; gap:10px; height:60px;">
  <img src="https://i.imgur.com/NYcTSls.png" 
     style="height:70px;">
  
  <span style="color:white; font-size:18px; font-weight:bold;">
    ONLINE SHOPPING 
  </span>

</header>

<div id="topBar">
<button id="ordersBtn">Orders</button>
<button id="adminBtn" onclick="openUpload()" style="display:none;">Upload</button>
</div>

<input id="search" placeholder="Search...">

<div id="products"></div>

<input type="file" id="imgFile" style="display:none;">

<script>

const ADMIN_EMAIL = "santoshking471@gmail.com";

// FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCA49EYDbqUnYu1sXs0ETDMIGaWxtoxXOM",
  authDomain: "reselling-store-c103e.firebaseapp.com",
  projectId: "reselling-store-c103e",
  storageBucket: "reselling-store-c103e.appspot.com"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

// LOGIN CHECK
auth.onAuthStateChanged(user=>{
  
  // Orders sirf login pe
  if(user){
    ordersBtn.style.display="inline-block";
  } else {
    ordersBtn.style.display="none";
  }

  // 🔥 Upload sirf admin ko
  if(user && user.email === ADMIN_EMAIL){
    adminBtn.style.display="inline-block";
  } else {
    adminBtn.style.display="none";
  }

});

// LOGIN
function login(){
  let email=prompt("Email");
  let pass=prompt("Password");

  auth.signInWithEmailAndPassword(email,pass)
  .catch(()=>auth.createUserWithEmailAndPassword(email,pass));
}

// LOAD PRODUCTS
function loadProducts(){
  db.collection("products").onSnapshot(data=>{
    let html="";
    data.forEach(doc=>{
      let p=doc.data();

      console.log(p);

      html+=`
      <div class="card">
        <img src="${p.image}" onclick="showDetails('${p.name}','${p.price}')">
        <h4>${p.name}</h4>

        <div class="priceRow">
          <span class="price">₹${p.price}</span>
          <button class="buy" onclick="buy('${doc.id}','${p.name}','${p.price}')">Buy</button>
        </div>
      </div>`;
    });

    products.innerHTML=html;
  });
}

// DETAILS POPUP
function showDetails(name,price){
  alert(
    "🛒 Product Details\n\n"+
    "Name: "+name+"\n"+
    "Price: ₹"+price+"\n\n"+
    "Click Buy to order 😎"
  );
}

// BUY WITH PHONE
function buy(id,name,price){
  let user=auth.currentUser;

  if(!user){
    if(confirm("Login required")){
      login();
    }
    return;
  }

  let cname=prompt("Enter Name");
  let phone=prompt("Enter Mobile Number");
  let address=prompt("Enter Address");

  if(!phone || phone.length<10){
    alert("Valid mobile number dal 😤");
    return;
  }

  db.collection("orders").add({
    productName:name,
    price:price,
    user:user.email,
    name:cname,
    phone:phone,
    address:address,
    time:new Date()
  });

  alert("Order Placed ✅");
}

// ADMIN IMAGE UPLOAD


// SEARCH
search.oninput=function(){
  let val=this.value.toLowerCase();

  db.collection("products").get().then(data=>{
    let html="";
    data.forEach(doc=>{
      let p=doc.data();

      if(p.name.toLowerCase().includes(val)){
        html+=`
        <div class="card">
          <img src="${p.image}">
          <h4>${p.name}</h4>
          <div class="priceRow">
            <span class="price">₹${p.price}</span>
            <button class="buy" onclick="buy('${doc.id}','${p.name}','${p.price}')">Buy</button>
          </div>
        </div>`;
      }
    });

    products.innerHTML=html;
  });
};

// START
loadProducts();
function openUpload(){
  document.getElementById("uploadBox").style.display = "block";
}

function uploadNow(){
  let name = document.getElementById("pname").value;
  let price = document.getElementById("pprice").value;
  let file = document.getElementById("pimage").files[0];

  let ref = storage.ref("products/" + file.name);

  ref.put(file).then(()=>{
    ref.getDownloadURL().then(url=>{

      db.collection("products").add({
        name:name,
        price:price,
        image:url
      });

      alert("Uploaded ✅");
    });
  });
}
</script>
<div id="uploadBox" style="display:none; padding:10px;">
  <h3>Upload Product</h3>

  <input id="pname" placeholder="Product Name"><br><br>
  <input id="pprice" placeholder="Price"><br><br>
  <input type="file" id="pimage"><br><br>

  <button onclick="uploadNow()">Upload Now</button>
</div>
</body>
</html>
