<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
body {
  font-family: Arial;
  background:#f1f3f6;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

.box {
  background:white;
  padding:20px;
  width:300px;
  border-radius:10px;
  text-align:center;
}

input {
  width:100%;
  padding:10px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:5px;
}

button {
  width:100%;
  padding:10px;
  background:#2874f0;
  color:white;
  border:none;
  border-radius:5px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
  <h2>Login 😎</h2>

  <input type="email" id="email" placeholder="Enter Email">
  <input type="password" id="password" placeholder="Enter Password">

  <button onclick="login()">Login</button>
  <button onclick="signup()">Signup</button>
</div>

<!-- ✅ Firebase v8 (IMPORTANT) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
// 🔥 FINAL CORRECT CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCA49EYDbqUnYu1sXsOETDMIGaWxtoxXOM",
  authDomain: "reselling-store-c103e.firebaseapp.com",
  projectId: "reselling-store-c103e",
  storageBucket: "reselling-store-c103e.appspot.com",
  messagingSenderId: "411682468136",
  appId: "1:411682468136:web:79cc2b622148f42a62e01d"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// ✅ SIGNUP
function signup(){
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(email, pass)
  .then(() => {
    alert("Signup success 👍");
  })
  .catch(err => {
    alert(err.message);
  });
}

// ✅ LOGIN
function login(){
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, pass)
  .then(() => {
    alert("Login success ✅");
    window.location.href = "index.html";
  })
  .catch(err => {
    alert(err.message);
  });
}
</script>

</body>
</html>
